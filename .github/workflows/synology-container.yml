name: Synology container

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Validate Synology Compose project
        run: |
          cp synology.env.example synology.env
          docker compose -f compose.synology.yml config --quiet
      - name: Build and start ${{ matrix.platform }} image
        run: ./scripts/test-synology-container.sh "${{ matrix.platform }}"
